<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Bibliotecolandia</title>
    <link rel="stylesheet" href="../css/padrao.css">
    <link rel="stylesheet" href="../css/login.css">
</head>

<body>
    <header class="Cabecalho login-cabecalho">
        <h1>Bibliotecolandia</h1>
        <h2>Acesso ao sistema</h2>
    </header>
    <main class="Container login-container">
        <div class="login-marca">
            <h2>Bem-vindo!</h2>
            <p>Entre com sua conta para acessar a biblioteca.</p>
        </div>
        <form class="form-login" onsubmit="realizarLogin(event)">
            <div class="Usuario"><label for="identificador">E-mail</label><input type="email" id="identificador"
                    autocomplete="username" placeholder="seu@email.com" required></div>
            <div class="Usuario"><label for="senhaLogin">Senha</label><input type="password" id="senhaLogin"
                    autocomplete="current-password" placeholder="Digite sua senha" required></div><button type="submit"
                class="btn_cadastro">Entrar</button>
            <p id="resultadoLogin" role="alert"></p>
        </form>
        <p class="dica-login">Clientes: use seu e-mail e senha de cadastro.</p>
    </main>
    <footer class="Rodape">
        <h3>Bibliotecolandia</h3>
        <p>João, Kevin e Murillo</p>
    </footer>
    <script src="../js/auth.js"></script>
</body>

</html>
